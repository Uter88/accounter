
services:
  accounter:
    container_name: accounter
    hostname: accounter
    build:
      context: ../
      dockerfile: deployments/Dockerfile
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      secret-key: 48716746efd74c80b72175f17e40224f
      server-port: 8001
      client-port: 8000
      dbhost: postgres
      dbport: 5431
      dbuser: uter
      dbpassword: 28031988Uter
      ssl_mode: disable
      qbrokers: kafka:29092
      qtopic: events
      qgroup: accounter

    networks:
      - app_network
  postgres:
    attach: false
    image: postgres:17
    container_name: postgres
    command: >
      postgres 
      -c listen_addresses=*
      -c port=5431
      -c hba_file='/etc/postgresql/pg_hba.conf'
    ports:
      - "5431:5431"
    restart: always
    environment:
      - POSTGRES_USER=uter
      - POSTGRES_PASSWORD=28031988Uter
      - POSTGRES_DB=main
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../tools/migrator/schemes/postgres:/docker-entrypoint-initdb.d:ro
      - ../config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uter -d main -p 5431"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  zookeeper:
    attach: false
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: zookeeper:2888:3888
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - app_network
  kafka:
    attach: false
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"  # Для внешнего подключения
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app_network

  kafka-ui:
    attach: false
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_JMXPORT: 9997
    restart: always
    networks:
      - app_network

volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  pgdata:

networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1